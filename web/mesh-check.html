<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nightshade mesh pipeline check</title><style>body{background:#0b1220;color:#dce9f7;font:16px system-ui;margin:24px}button{font:inherit;padding:12px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Mesh pipeline check</h1><p>Tests the captured Nightshade mesh pipeline without WASM, a scene, or audio. Tap Run checks to start GPU work.</p><button id="run">Run checks</button><button id="copy">Copy report</button><pre id="report"></pre><script type="module">
import {runMeshCheck} from './mesh-check.js?v=1';
const key='nightshade-mesh-check',output=document.getElementById('report');let previous;try{previous=JSON.parse(localStorage.getItem(key));if(previous)delete previous.previous;}catch{}
const report={version:1,userAgent:navigator.userAgent,deviceMemory:navigator.deviceMemory,status:'Not started',lines:[],previous};function show(){output.textContent=JSON.stringify(report,null,2);try{localStorage.setItem(key,output.textContent);}catch{}}show();document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output.textContent);document.getElementById('copy').textContent='Copied';}catch{document.getElementById('copy').textContent='Select report below';}};document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;report.status='Running';show();try{report.result=await runMeshCheck(line=>{report.lines.push(line);show();});report.status=report.result.failed?'Failed':'Passed';}catch(error){report.status='Failed';report.error=String(error?.stack||error);}show();};</script></html>
