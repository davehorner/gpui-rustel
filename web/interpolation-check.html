<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interpolation equivalence check</title><style>body{background:#0b1220;color:#dce9f7;font:16px system-ui;margin:24px}button{font:inherit;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Interpolation equivalence check</h1><p>Compares hardware-linear interpolation with the browser workaround at different vertex depths. GPU work starts when you tap Run.</p><button id="run">Run</button><button id="copy">Copy report</button><pre id="report"></pre><script>
const report={status:'Not started',lines:[]};function show(){document.getElementById('report').textContent=JSON.stringify(report,null,2);}show();document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(report,null,2));document.getElementById('copy').textContent='Copied';}catch{document.getElementById('copy').textContent='Select report below';}};
document.getElementById('run').onclick=async()=>{let device;try{report.status='Running';show();device=await(await navigator.gpu.requestAdapter()).requestDevice();
async function render(manual,weights){
 const code=`struct Out {@builtin(position) position:vec4f,@location(0) @interpolate(${manual?'perspective':'linear'}) value:vec3f}; @vertex fn vs(@builtin(vertex_index) i:u32)->Out {var p=array<vec2f,3>(vec2f(-1,-1),vec2f(3,-1),vec2f(-1,3));var uv=array<vec2f,3>(vec2f(0,0),vec2f(1,0),vec2f(0,1));var w=array<f32,3>(${weights.map(w=>w+'.0').join(',')});var out:Out;out.position=vec4f(p[i]*w[i],0.5*w[i],w[i]);out.value=vec3f(uv[i],w[i]/8.0)${manual?'*w[i]':''};return out;} @fragment fn fs(in:Out)->@location(0) vec4f {return vec4f(in.value${manual?'*in.position.w':''},1);}`;
 const module=device.createShaderModule({code}),pipeline=device.createRenderPipeline({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format:'rgba8unorm'}]}});
 const texture=device.createTexture({size:[64,64],format:'rgba8unorm',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC}),buffer=device.createBuffer({size:64*64*4,usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST});
 const encoder=device.createCommandEncoder(),pass=encoder.beginRenderPass({colorAttachments:[{view:texture.createView(),loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}]});pass.setPipeline(pipeline);pass.draw(3);pass.end();encoder.copyTextureToBuffer({texture},{buffer,bytesPerRow:256},{width:64,height:64,depthOrArrayLayers:1});device.queue.submit([encoder.finish()]);await buffer.mapAsync(GPUMapMode.READ);const bytes=new Uint8Array(buffer.getMappedRange()).slice();buffer.unmap();buffer.destroy();texture.destroy();return bytes;
}
for(const weights of [[1,1,1],[1,2,4],[1,7,3]]){const reference=await render(false,weights),manual=await render(true,weights);let difference=0;for(let i=0;i<reference.length;i++)difference=Math.max(difference,Math.abs(reference[i]-manual[i]));if(new Set(reference).size<20)throw Error('Reference did not render a gradient');report.lines.push({clipWeights:weights,maxByteDifference:difference});show();if(difference>1)throw Error('Interpolation differs by more than one UNORM byte');}
report.status='Passed';}catch(error){report.status='Failed';report.error=String(error?.stack||error);}finally{device?.destroy();show();}};
</script>
