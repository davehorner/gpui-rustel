<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPUI Rustel · Web</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111c;color:#dce9f7;font:16px system-ui}#boot{position:fixed;inset:0;display:grid;place-content:center;gap:1rem;z-index:9999;background:#08111c;padding:2rem;white-space:pre-wrap}#boot[hidden]{display:none}a{color:#1ff2d1}</style></head>
<body><div id="boot" role="status">Loading GPUI Rustel…<noscript>JavaScript is required to start this WebAssembly viewer.</noscript></div>
<script type="module">
import {startup} from './startup.js?v=__VIEWER_VERSION__';
const params=new URLSearchParams(location.search);
if(params.has('studio')) {
  const {startStudio}=await import('./studio.js?v=__STUDIO_VERSION__');
  await startStudio('__AUDIO_HOST_VERSION__','__STUDIO_VERSION__');
} else {
const diag=startup(document.querySelector('#boot'),'GPUI Rustel','__VIEWER_VERSION__');
try {
  await diag.check();diag.phase('Downloading and compiling the GPUI/Rustel WASM module');
  const wasm=await import('./pkg/__VIEWER_VERSION__/gpui_rustel.js');await wasm.default();
  const params=new URLSearchParams(location.search),local=!params.has('hub')&&params.get('audio')!=='native';
  const firstFrame=new Promise((resolve,reject)=>{const onStage=event=>{if(event.detail?.stage==='ready'||event.detail?.stage==='error'){window.removeEventListener('nightshade-stage',onStage);if(event.detail.stage==='ready')resolve();else reject(Error(event.detail.message));}};window.addEventListener('nightshade-stage',onStage);});
  diag.phase('Starting the GPUI interface');wasm.run(local?'browser':(params.get('hub')||'ws://127.0.0.1:19613'));
  if(local){await firstFrame;diag.phase('Preparing audio and instruments');const {LocalAudioHost}=await import('./audio-host.js?v=__AUDIO_HOST_VERSION__');const audio=new LocalAudioHost(wasm);const {mountConsole}=await import('./console.js?v=__VIEWER_VERSION__');mountConsole(audio);window.addEventListener('pagehide',()=>audio.close(),{once:true});try{await audio.start();}catch(error){audio.failure(String(error));diag.phase(`Audio unavailable: ${error}`);}}
  if(!local)await firstFrame;diag.appReady();
}catch(error){diag.fail(error);}
}
</script></body></html>
