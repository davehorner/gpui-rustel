[package]
name = "gpui-rustel"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[lib]
name = "gpui_rustel_app"
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit = { path = "vendor/gpui-nightshade/upstream/gpui-component/crates/kit" }
web-time = "1"

music-link = { path = "vendor/music-link" }
hearsay = { git = "https://github.com/matthewjberger/hearsay", rev = "033cf8ba3ef87614f45ac397d5cb940898433a5d" }
serde_json = "1"
rustel-ui-adapter = { path = "upstream-adapter" }


gpui-nightshade = { path = "vendor/gpui-nightshade/crates/gpui-nightshade" }
gpui-nightshade-components = { path = "vendor/gpui-nightshade/crates/gpui-nightshade-components" }
nightshade = { path = "vendor/gpui-nightshade/upstream/nightshade/crates/nightshade" }
nightshade-render = { path = "vendor/gpui-nightshade/upstream/nightshade/crates/plugins/describe/nightshade-render" }
nightshade-viewer-core = { path = "vendor/gpui-nightshade/crates/nightshade-viewer-core" }
nightshade-gltf = { path = "vendor/gpui-nightshade/upstream/nightshade/crates/plugins/domain/nightshade-gltf" }
nightshade-prefab = { path = "vendor/gpui-nightshade/upstream/nightshade/crates/plugins/domain/nightshade-prefab" }
nightshade-camera-controller = { path = "vendor/gpui-nightshade/upstream/nightshade/crates/plugins/domain/nightshade-camera-controller" }
nightshade-animation = { path = "vendor/gpui-nightshade/upstream/nightshade/crates/plugins/domain/nightshade-animation" }
nightshade-scene = { path = "vendor/gpui-nightshade/upstream/nightshade/crates/plugins/describe/nightshade-scene" }
nightshade-text = { path = "vendor/gpui-nightshade/upstream/nightshade/crates/plugins/describe/nightshade-text" }
oxc_allocator = "0.144.0"
oxc_ast = "0.144.0"
oxc_ast_visit = "0.144.0"
oxc_parser = "0.144.0"
oxc_span = "0.144.0"
oxc_semantic = "0.144.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustel-studio = { path = ".build-sources/rustel-browser-engine/crates/studio", default-features = false, features = ["external-host"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false }
pollster = "0.4"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event", "Window", "Location", "CustomEvent", "CustomEventInit", "EventTarget"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"

[workspace]
exclude = [".build-sources/rustel-browser-engine", ".build-sources/rustel-browser-engine/crates/*", "upstream-adapter", "wasm-audio", "vendor/gpui-nightshade", "vendor/music-link"]
resolver = "2"

[patch.crates-io]
crossterm = { path = "wasm-studio/vendor/crossterm" }
gpui-pre-wgpu = { path = "vendor/gpui-nightshade/upstream/gpui-snapshot/gpui-wgpu" }
wgpu = { path = "vendor/gpui-nightshade/upstream/wgpu-web-compat" }
gpui-pre = { path = "vendor/gpui-nightshade/upstream/gpui-snapshot/gpui" }
gpui-pre-windows = { path = "vendor/gpui-nightshade/upstream/gpui-snapshot/gpui-windows" }

[profile.web]
inherits = "release"
opt-level = 1
codegen-units = 16
strip = "debuginfo"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
