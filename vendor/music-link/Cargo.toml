[package]
name = "music-link"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hearsay = { path = "../hearsay", features = ["websockets"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }

[[bin]]
name = "music-hub"
path = "src/main.rs"

[lints]
