[package]
name = "rustel-browser-studio"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
oxc_allocator = "0.144.0"
oxc_ast = "0.144.0"
oxc_ast_visit = "0.144.0"
oxc_parser = "0.144.0"
oxc_span = "0.144.0"
oxc_semantic = "0.144.0"
rustel-studio = { path = "../.build-sources/rustel-browser-engine/crates/studio", default-features = false }
serde_json = "1"
rustel-transpiler = { path = "../.build-sources/rustel-browser-engine/crates/transpiler" }
js-sys = "0.3"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false }
wasm-bindgen = "=0.2.130"
getrandom = { version = "0.2", features = ["js"] }

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
